<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Michael Vijay API Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  {% load static %}
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body>

<div class="container">

  <header class="header">
    <h1 class="cyber-logo">Shiloh Digital CoinSwitch API Panel</h1>
    <div class="header-action">
       <a href="auto-trade" class="quick-btn">⚡ Auto Trade</a>
    </div>
  </header>

  <section class="quick-buttons">
    <h3>Quick API Calls</h3>
    <div class="button-grid">
      <button class="quick-btn" data-api="broker_balance">Broker Balance</button>
      <button class="quick-btn" data-api="master_balance">Master Balance</button>
      <button class="quick-btn" data-api="recent_orders">Recent Order Details</button>
      <button class="quick-btn" data-api="average_trade_price">Average trd price</button>
      <button class="transaction-btn" data-api="cancel_order">Cancel Order</button>
      <button class="quick-btn" data-api="cancel_all_order" data-confirm="true">Cancel all usdt/inr Order</button>
    </div>
  </section>

  <section class="transaction-buttons">
    <h3>Crypto Transactions</h3>
    <div class="button-grid">
      <button class="transaction-btn" data-api="buy_market_order">BUY Market Order</button>
      <button class="transaction-btn" data-api="buy_limit_order">BUY Limit Order</button>
      <button class="transaction-btn" data-api="transfer_master_to_broker">Transfer Master to Broker</button> 
      <button class="transaction-btn" data-api="crypto_withdrawal">Crypto Withdrawal</button>
      <button class="transaction-btn" data-api="transfer_broker_to_master">Transfer Broker to Master</button>
      <!-- <button class="transaction-btn" data-api="sell_market_order">SELL Market Order</button> -->
      <button class="transaction-btn" data-api="sell_limit_order">SELL Limit Order</button>
      <button class="transaction-btn" data-api="inr_withdrawal">INR Withdrawal</button>
    </div>
  </section>

  <section class="terminal">
    <form method="POST" id="apiForm">
      {% csrf_token %}
      <div class="form-grid" id="inputFields"></div>
      <button type="submit" class="execute-btn" id="executeBtn" style="display: none;">
        <i class="fas fa-bolt"></i> EXECUTE
      </button>
    </form>
  </section>

  <section class="loading" id="loading">
    <div class="spinner"></div>
    <p>Processing API request…</p>
  </section>

  <section class="response-section" id="responseSection">
    <div class="response-header">
      <h3>API RESPONSE</h3>
      <div id="statusCode" class="status-badge"></div>
    </div>
    <pre id="responseBox"></pre>
  </section>

</div>

<div id="customModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-icon">⚠️</div>
    <h3>Confirmation Required</h3>
    <p>This will <b>CANCEL ALL ORDERS</b>.<br>This action cannot be undone.</p>
    <div class="modal-actions">
      <button id="modalCancel" class="modal-btn cancel">No, Go Back</button>
      <button id="modalConfirm" class="modal-btn confirm">Yes, Execute</button>
    </div>
  </div>
</div>

<script>
  window.APP_CONTEXT = {
    method: "{{ request.method }}",
    response: "{{ response|escapejs }}"
  }
</script>

<script src="{% static 'js/dashboard.js' %}"></script>

<!-- Visual Only: Highlight Clicked Buttons -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.button-grid').forEach(grid => {
      const buttons = grid.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active-btn'));
          btn.classList.add('active-btn');
        });
      });
    });
  });
</script>
</body>
</html>
