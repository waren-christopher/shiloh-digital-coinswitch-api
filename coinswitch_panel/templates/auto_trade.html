<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Auto Trade | Terminal</title>
  {% load static %}<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
  <style>
    /* Specific overrides for auto trade */

    .header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .back-btn {
        position: absolute;
        left: 124px;
        color: #94a3b8;
        text-decoration: none;
        font-family: 'Inter', sans-serif;
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: color 0.2s ease, transform 0.2s ease;
    }
    .back-btn:hover {
        color: #ffffff;
        transform: translateX(-3px); /* Small slide animation on hover */
    }

    #statusDisplay { 
        padding: 16px; 
        margin: 25px auto 0; 
        border-radius: 12px; 
        text-align: center; 
        font: 600 1rem 'Inter', sans-serif; 
        display: none; 
        letter-spacing: 0.5px; 
        width: 100%; 
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        backdrop-filter: blur(8px);
        animation: scaleIn 0.3s ease;
    }
    
    .status-success { 
        background: rgba(16, 185, 129, 0.15); 
        color: #6ee7b7; 
        border: 1px solid rgba(16, 185, 129, 0.3); 
    }
    
    .status-error { 
        background: rgba(239, 68, 68, 0.15); 
        color: #fca5a5; 
        border: 1px solid rgba(239, 68, 68, 0.3); 
    }

    .action-container { 
        display: flex; 
        justify-content: center; 
        margin-top: 30px; 
        width: 100%; 
    }
    
    /* We keep start/stop button background overrides because they specifically must be green/red */
    #startBtn { background: linear-gradient(135deg, #10b981, #059669); } 
    #stopBtn { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
    #stopBtn:hover { box-shadow: 0 8px 25px rgba(239, 68, 68, 0.5); }
    
    .form-grid { margin-bottom: 35px; } /* Give extra space for error msgs */
    /* --- MOBILE RESPONSIVENESS --- */
    @media (max-width: 600px) {
        .back-btn {
            left: 12px;
            font-size: 0.8rem;
        }
        .cyber-logo {
            font-size: 1.5rem;
        }
    }
  </style>
</head>
<body>
<div class="container">
  <a href="/" class="back-btn">
        <i class="fas fa-arrow-left"></i> Dashboard
  </a>
  <div class="header">
      <h1 class="cyber-logo">⚡ Auto Trade</h1>
  </div>
  
  <div class="button-grid" style="margin-bottom: 30px;">
    <button id="buyBtn" class="transaction-btn active-btn" style="border-left-color: #10b981;">BUY</button>
    <button id="sellBtn" class="transaction-btn" style="border-left-color: #ef4444;">SELL</button>
  </div>
  
  <form id="autoTradeForm" class="terminal">
    <div class="form-grid">
      <div class="form-group"><span class="input-label">PRICE RANGE *</span><input name="price_range" id="price_range"><div id="err_price_range" class="error-message">Required</div></div>
      <div class="form-group"><span class="input-label">MIN QUANTITY *</span><input name="min_qty" id="min_qty" value="200"><div id="err_min_qty" class="error-message">Required</div></div>
      <div class="form-group"><span class="input-label">QUANTITY *</span><input name="quantity" id="quantity"><div id="err_quantity" class="error-message">Required</div></div>
      <div class="form-group"><span class="input-label">TYPE *</span><input name="type" value="limit" readonly></div>
      <div class="form-group"><span class="input-label">SIDE *</span><input name="side" id="side" value="BUY" readonly></div>
      <div class="form-group"><span class="input-label">INSTRUMENT *</span><input name="instrument" value="USDT/INR" readonly></div>
      <div class="form-group"><span class="input-label">QUANTITY TYPE *</span><input name="quantityType " value="QUOTE" readonly></div>
      <div class="form-group"><span class="input-label">USERNAME *</span><input name="username" value="shilohdigital_otc" readonly></div>
    </div>
    
    <div class="action-container">
      <button type="button" id="startBtn" class="btn-small">START</button>
      <button type="button" id="stopBtn" class="btn-small" style="display:none;">STOP</button>
    </div>

    <div id="statusDisplay"></div>
  </form>
</div>

<div id="stopModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-icon">⚠️</div>
    <h3>Confirmation Required</h3>
    <p>Are you sure you want to <b>STOP</b> the auto trade bot?<br>This will halt current automatic trading.</p>
    <div class="modal-actions">
      <button id="stopCancel" class="modal-btn cancel" type="button">No, Keep Running</button>
      <button id="stopConfirm" class="modal-btn confirm" type="button">Yes, Stop Bot</button>
    </div>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const $ = id => document.getElementById(id);
    const btns = { start: $('startBtn'), stop: $('stopBtn'), buy: $('buyBtn'), sell: $('sellBtn') };
    let pollInterval = null; 
    
    const showStatus = (m, err = false) => {
        // Add icons based on error state
        $('statusDisplay').innerHTML = err ? `⚠️ ${m}` : `✅ ${m}`;
        $('statusDisplay').className = err ? 'status-error' : 'status-success';
        $('statusDisplay').style.display = 'block';
        // Note: setTimeout removed so message stays visible until next action
    };

    const toggleSide = (side) => {
        $('side').value = side;
        btns.buy.classList.toggle('active-btn', side === 'BUY');
        btns.sell.classList.toggle('active-btn', side === 'SELL');
    };

    btns.buy.onclick = () => toggleSide('BUY');
    btns.sell.onclick = () => toggleSide('SELL');

    const api = async (url, body = null) => {
        try {
            const res = await fetch(url, { method: 'POST', headers: {'X-CSRFToken': '{{ csrf_token }}'}, body });
            return { ok: res.ok, data: await res.json() };
        } catch { return { ok: false, data: { msg: 'CONNECTION ERROR' } }; }
    };

    // Polling function to check backend status
    const startPolling = () => {
        if (pollInterval) clearInterval(pollInterval); 
        
        pollInterval = setInterval(async () => {
            try {
                const res = await fetch("/auto-trade-status");
                const statusData = await res.json();
                
                // Continuously update the UI with the latest bot message
                if (statusData.message) {
                    // Check if it's an error message or just normal status
                    const isErr = !statusData.running && statusData.message.toLowerCase().includes('error');
                    showStatus(statusData.message, isErr);
                }

                // If backend says bot is no longer running
                if (!statusData.running) {
                    clearInterval(pollInterval);
                    btns.start.style.display = 'flex';
                    btns.stop.style.display = 'none';
                }
            } catch (err) {
                console.log("Error checking status:", err);
            }
        }, 2000); // Poll every 2 seconds
    };

    // Check status immediately on page load
    const init = await fetch("/auto-trade-status").then(r => r.json()).catch(() => ({}));
    if (init.running) { 
        btns.start.style.display = 'none'; 
        btns.stop.style.display = 'flex'; 
        startPolling(); 
    } else if (init.message) {
        // Show any leftover messages on reload
        showStatus(init.message, true);
    }

    btns.start.onclick = async () => {
        // Clear any old messages when clicking start
        $('statusDisplay').style.display = 'none'; 

        let valid = true;
        ['price_range', 'min_qty', 'quantity'].forEach(f => {
            const v = $(f).value.trim();
            $(f).classList.toggle('input-error', !v);
            $(`err_${f}`).style.display = v ? 'none' : 'block';
            if (!v) valid = false;
        });
        if (!valid) return;

        const originalText = btns.start.innerHTML;
        btns.start.innerHTML = '⏳ STARTING...';
        btns.start.disabled = true;

        const { ok, data } = await api('/start-auto-trade', new FormData($('autoTradeForm')));
        
        btns.start.innerHTML = originalText;
        btns.start.disabled = false;

        if (ok) { 
            btns.start.style.display = 'none'; 
            btns.stop.style.display = 'flex'; 
            showStatus(data.msg || 'BOT STARTED');
            startPolling(); 
        } else {
            showStatus(data.msg || 'FAILED TO START', true);
        }
    };

    const stopModal = $('stopModal');
    const stopConfirm = $('stopConfirm');
    const stopCancel = $('stopCancel');

    const closeStopModal = () => stopModal.style.display = 'none';
    stopCancel.onclick = closeStopModal;
    stopModal.onclick = e => { if (e.target === stopModal) closeStopModal(); };

    btns.stop.onclick = () => {
        stopModal.style.display = 'flex';
    };

    stopConfirm.onclick = async () => {
        closeStopModal();
        const originalText = btns.stop.innerHTML;
        btns.stop.innerHTML = '⏳ STOPPING...';
        btns.stop.disabled = true;

        const { ok, data } = await api('/stop-auto-trade');
        
        btns.stop.innerHTML = originalText;
        btns.stop.disabled = false;
        
        if (ok) { 
            if (pollInterval) clearInterval(pollInterval); 
            btns.start.style.display = 'flex'; 
            btns.stop.style.display = 'none'; 
            showStatus(data.msg || 'BOT STOPPED', true); 
        } else {
            showStatus('ERROR STOPPING BOT', true);
        }
    };
});
</script>
</body>
</html>
